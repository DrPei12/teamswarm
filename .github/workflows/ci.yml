name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
      - run: python -B scripts/rebuild-npm-runtime.py --check
      - run: npm ci --no-audit --no-fund
      - run: npm audit --audit-level=moderate
      - run: npm run release:check
      - run: npm run check
      - run: npm run build
      - run: npm run test:smoke
      - run: node teamswarm/node_modules/playwright/cli.js install chromium
      - run: node test/browser/offline-drafts.mjs
      - run: node test/browser/project-history.mjs
      - run: node teamswarm/scripts/verify-composer.mjs
      - run: node teamswarm/scripts/verify-frontend-stability.mjs
      - run: node teamswarm/scripts/verify-files.mjs
      - run: npm run harness:install -- pi opencode
      - run: node test/browser/resource-configuration.mjs
      - run: node test/browser/execution-permissions.mjs
      - run: node test/native/opencode-output-budget.mjs
      - run: node test/native/pi-model-configuration.mjs
