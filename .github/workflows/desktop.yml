name: Desktop packages
on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        default: windows-2025
        options: [windows-2025, ubuntu-24.04, macos-15]
permissions:
  contents: read
jobs:
  package:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.0
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci --no-audit --no-fund
      - run: npm run release:check
      - run: npm run check
        env:
          NODE_OPTIONS: --test-reporter=tap
      - run: npm run desktop:build
      - name: Verify macOS packages and desktop
        if: runner.os == 'macOS'
        run: node scripts/verify-macos-package.mjs release/darwin-arm64
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TeamSwarm-${{ inputs.runner }}
          if-no-files-found: error
          retention-days: 14
          path: |
            release/*/TeamSwarm-*.exe
            release/*/TeamSwarm-*.AppImage
            release/*/TeamSwarm-*.deb
            release/*/TeamSwarm-*.dmg
            release/*/TeamSwarm-*.zip
            release/*/SHA256SUMS.txt
            release/*/release-manifest.json
            release/*/macos-verification.json
            release/*/macos-desktop.png
      - name: Upload macOS diagnostics
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TeamSwarm-macOS-diagnostics
          retention-days: 7
          if-no-files-found: ignore
          path: |
            release/*/macos-verification.json
            release/*/macos-desktop.png
