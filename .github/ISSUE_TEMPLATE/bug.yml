name: Bug report
description: Report a reproducible problem in TeamSwarm.
body:
  - type: input
    id: version
    attributes:
      label: TeamSwarm version
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system, architecture and harness version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a small example and remove credentials and private content.
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and observed behavior
    validations:
      required: true
